name: Go

on:
  push:
    branches: [main, master, v6, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: 'off'
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', '1.26.8']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Verify modules
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Build packages and examples
        run: |
          go build ./...
          go build ./_examples/bridge ./_examples/helloworld ./_examples/play ./_examples/record ./_examples/stasisStart ./_examples/twoapps
      - name: Race tests
        run: go test -race ./...
      - name: Vulnerability scan
        if: matrix.go == '1.26.8'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
